name: Integration Tests (Sigstore Staging)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  # Required for Sigstore keyless signing via GitHub OIDC
  id-token: write
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests (Sigstore staging)
        run: pytest -m integration --tb=short -q
        env:
          # Tests use --staging flag to hit Sigstore staging infrastructure
          # GitHub Actions OIDC token is automatically available via
          # sigstore.oidc.detect_credential() when id-token: write is set
          SKILL_TRUST_STAGING: "1"
