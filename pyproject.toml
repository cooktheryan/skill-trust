[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "skill-trust"
version = "0.3.0"
description = "Keyless signing and verification for AI agent skills using Sigstore"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Richard Cook" },
]
keywords = ["sigstore", "signing", "verification", "ai-agent", "skills", "supply-chain-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "sigstore==4.5.1",
    "click==8.3.2",
    "rich==14.3.4",
    "cryptography>=47.0.0,<51.0.0",
]

[project.scripts]
skill-trust = "skill_trust.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require Sigstore staging infrastructure (deselect with '-m \"not integration\"')",
]
